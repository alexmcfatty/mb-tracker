<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f172a;--surf:#1e293b;--bdr:#334155;--bdr2:#263348;--tx:#e2e8f0;--tx2:#cbd5e1;--tx3:#94a3b8;--tx4:#64748b;--tx5:#475569;--inp:#0f172a;--g:#22c55e;--r:#ef4444;--am:#f59e0b;--bl:#60a5fa;--pu:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;font-size:14px}
.header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:16px;color:#3b82f6}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-weight:600;font-size:12px;transition:all .15s}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-s{background:var(--bdr);color:var(--tx)}.btn-s:hover{background:var(--tx5)}
.btn-sm{padding:5px 10px;font-size:11px}.btn-xs{padding:3px 8px;font-size:10px;border-radius:5px}
.content{max-width:1400px;margin:0 auto;padding:20px}
/* Auth */
#auth-wrap{max-width:360px;margin:80px auto;text-align:center}
#auth-wrap h1{font-size:20px;font-weight:700;margin-bottom:6px}
#auth-wrap p{color:var(--tx4);font-size:13px;margin-bottom:22px}
.auth-box{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:24px}
input[type=email],input[type=password]{background:var(--inp);border:1px solid var(--bdr);border-radius:6px;padding:10px 12px;color:var(--tx);font-size:13px;width:100%;margin-bottom:10px}
input:focus{outline:none;border-color:#3b82f6}
.auth-err{color:var(--r);font-size:12px;margin-top:6px;min-height:18px}
/* Student grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s}
.sc:hover{border-color:#3b82f6}
.sc-name{font-weight:700;font-size:14px;color:var(--tx);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-sub{font-size:10px;color:var(--tx5);margin-bottom:10px}
.sc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ss{background:var(--inp);border-radius:6px;padding:8px 10px}
.ss-lbl{font-size:9px;color:var(--tx5);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.ss-val{font-size:15px;font-weight:700}
.sc-foot{display:flex;align-items:center;justify-content:space-between}
.cp-badge{background:#2563eb22;color:#60a5fa;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
/* Modal */
.modal{display:none;position:fixed;inset:0;background:#00000099;z-index:200;overflow-y:auto;padding:20px}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.mbox{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;width:100%;max-width:860px;padding:24px;position:relative;margin:auto}
.mclose{position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--tx4);font-size:20px;cursor:pointer;line-height:1}
.mclose:hover{color:var(--tx)}
.mtitle{font-size:17px;font-weight:700;margin-bottom:2px}
.msub{font-size:12px;color:var(--tx4);margin-bottom:16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.ds{background:var(--inp);border-radius:8px;padding:10px 12px}
.ds-lbl{font-size:9px;color:var(--tx5);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ds-val{font-size:16px;font-weight:700}
.stitle{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.cp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 8px;color:var(--tx5);font-size:9px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bdr)}
td{padding:6px 8px;border-bottom:1px solid var(--bdr2);color:var(--tx2)}
.profbox{background:var(--inp);border-radius:8px;padding:12px;font-size:12px;color:var(--tx2);line-height:1.6;white-space:pre-wrap;max-height:180px;overflow-y:auto}
/* Notif */
.ndot{width:8px;height:8px;background:var(--r);border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle}
#npanel{display:none;background:var(--surf);border-bottom:1px solid var(--bdr);padding:14px 20px}
.nitem{padding:10px 0;border-bottom:1px solid var(--bdr2);font-size:12px}
.nitem:last-child{border-bottom:none}
.ntime{font-size:10px;color:var(--tx5);margin-top:2px}
/* Toast */
.toast{position:fixed;bottom:18px;right:18px;background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:9px 14px;font-size:12px;color:var(--tx);z-index:9999;transform:translateY(70px);opacity:0;transition:all .22s;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}
.tok{border-left:3px solid var(--g)}.terr{border-left:3px solid var(--r)}
.g{color:var(--g)}.r{color:var(--r)}.am{color:var(--am)}.bl{color:var(--bl)}.pu{color:var(--pu)}
.empty{text-align:center;padding:28px;color:var(--tx5);font-size:12px}
</style>
</head>
<body>

<div id="auth-wrap">
  <h1>Coach Dashboard</h1>
  <p>Sign in with your coach account</p>
  <div class="auth-box">
    <input type="email" id="ae" placeholder="Email" onkeydown="if(event.key==='Enter')doSignIn()">
    <input type="password" id="ap" placeholder="Password" onkeydown="if(event.key==='Enter')doSignIn()">
    <button class="btn btn-p" style="width:100%;padding:10px" onclick="doSignIn()">Sign In</button>
    <div class="auth-err" id="aerr"></div>
  </div>
</div>

<div id="main" style="display:none">
  <div class="header">
    <div class="logo">Coach Dashboard</div>
    <div style="font-size:11px;color:var(--tx5)" id="lrefresh"></div>
    <div class="hright">
      <button class="btn btn-s btn-sm" onclick="loadStudents()">↻ Refresh</button>
      <span onclick="toggleNotifs()" style="cursor:pointer;font-size:12px;color:var(--tx3)">
        Notifications <span class="ndot" id="ndot" style="display:none"></span>
      </span>
      <button class="btn btn-s btn-sm" onclick="doSignOut()">Sign Out</button>
    </div>
  </div>

  <div id="npanel">
    <div style="font-weight:700;font-size:13px;margin-bottom:10px">Checkpoint Notifications</div>
    <div id="nlist" style="max-height:200px;overflow-y:auto"><div class="empty">No notifications yet</div></div>
  </div>

  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700">Students</div>
      <div style="font-size:12px;color:var(--tx4)" id="scount"></div>
    </div>
    <div id="sloading" style="text-align:center;padding:40px;color:var(--tx4)">Loading…</div>
    <div class="sgrid" id="sgrid"></div>
  </div>
</div>

<div class="modal" id="dmodal">
  <div class="mbox">
    <button class="mclose" onclick="closeDetail()">✕</button>
    <div class="mtitle" id="d-name"></div>
    <div class="msub" id="d-email"></div>
    <div class="dgrid" id="d-stats"></div>
    <div class="cp-row">
      <div class="stitle" style="margin:0">Checkpoint</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="cp-badge" id="d-cp">CP 1</span>
        <button class="btn btn-s btn-xs" onclick="adjCP(-1)">◀ Back</button>
        <button class="btn btn-p btn-xs" onclick="adjCP(1)">Forward ▶</button>
      </div>
    </div>
    <div class="stitle">Recent Bets (last 20)</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Bookie</th><th>Type</th><th>Stake</th><th>Odds</th><th>BSP</th><th>EV%</th><th>Result</th><th>P&L</th></tr></thead><tbody id="d-bets"></tbody></table></div>
    <div class="stitle">Coaching Profile</div>
    <div class="profbox" id="d-prof">No profile yet.</div>
    <div class="stitle">Bonuses</div>
    <div id="d-bon" style="font-size:12px;color:var(--tx3)"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://ncqdxovhzjvdoruoookj.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jcWR4b3Zoemp2ZG9ydW9vb2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NzY4ODUsImV4cCI6MjEwMzI1Mjg4NX0.nNL_8zCFoYCZv1lrkFLY4jAF5k1mcx-1ji8_CJ94JWI';
const COACH_EMAIL = 'alexmcfadden226@gmail.com';

const {createClient} = supabase;
const supa = createClient(SUPA_URL, SUPA_KEY);

let _user=null, _students=[], _detail=null, _notifs=[], _ch=null;

// ── AUTH ──────────────────────────────────────────────────────────
async function doSignIn(){
  const email=document.getElementById('ae').value.trim();
  const pass=document.getElementById('ap').value;
  document.getElementById('aerr').textContent='';
  if(email!==COACH_EMAIL){document.getElementById('aerr').textContent='Not authorised as coach.';return;}
  const {data,error}=await supa.auth.signInWithPassword({email,password:pass});
  if(error){document.getElementById('aerr').textContent=error.message;return;}
  _user=data.user;showMain();
}
async function doSignOut(){
  await supa.auth.signOut();_user=null;
  if(_ch)supa.removeChannel(_ch);
  document.getElementById('main').style.display='none';
  document.getElementById('auth-wrap').style.display='block';
}
supa.auth.onAuthStateChange((event,session)=>{
  if(session?.user&&session.user.email===COACH_EMAIL){_user=session.user;showMain();}
});
function showMain(){
  document.getElementById('auth-wrap').style.display='none';
  document.getElementById('main').style.display='block';
  loadStudents();setupRealtime();
}

// ── LOAD STUDENTS ─────────────────────────────────────────────────
async function loadStudents(){
  document.getElementById('sloading').style.display='block';
  document.getElementById('sgrid').innerHTML='';
  // Fetch emails via secure RPC function
  const emailMap={};
  try{
    const {data:emails}=await supa.rpc('get_student_emails');
    (emails||[]).forEach(r=>{emailMap[r.user_id]=r.email;});
  }catch(e){console.warn('Email fetch failed:',e);}
  const {data,error}=await supa.from('user_data').select('user_id,data,updated_at').order('updated_at',{ascending:false});
  if(error){document.getElementById('sloading').innerHTML='<div style="color:var(--r)">Error: '+error.message+'</div>';return;}
  _students=(data||[]).map(row=>buildStudent(row,emailMap[row.user_id]));
  document.getElementById('sloading').style.display='none';
  document.getElementById('scount').textContent=_students.length+' students';
  document.getElementById('lrefresh').textContent='Refreshed '+new Date().toLocaleTimeString('en-AU');
  renderGrid();
}

function buildStudent(row,authEmail){
  const d=row.data||{};
  const settings=d.settings||{};
  const bets=(d.bets||[]).filter(b=>!b.deleted);
  const bonuses=d.bonuses||[];
  const bookies=d.bookies||[];
  const promos=d.promos||[];
  const email=authEmail||settings.email||null;
  const displayName=email||row.user_id.slice(0,8)+'…';
  const checkpoint=settings.checkpoint||1;

  // P&L from bets
  let cashPnl=0;
  bets.forEach(b=>{
    if(b.result==='Win') cashPnl+=(b.fixedOdds-1)*(b.stake||0);
    else if(b.result==='Loss') cashPnl-=(b.stake||0);
    else if(b.result==='Bonus') cashPnl-=(b.stake||0); // stake goes to bonus
  });

  // Bonus P&L (resolved bonuses have profit field)
  const resolvedBonuses=bonuses.filter(b=>b.result==='Win'||b.result==='Loss');
  const bonusPnl=resolvedBonuses.reduce((a,b)=>a+(parseFloat(b.profit)||0),0);
  // Also add cash-back voids back (stake returned)
  bets.filter(b=>b.result==='Void').forEach(b=>{}); // void = stake returned, no P&L

  const totalPnl=cashPnl+bonusPnl;

  // EV
  let ev=0;
  const settled=bets.filter(b=>b.result&&b.result!=='Pending');
  settled.forEach(b=>{
    if(b.betCategory==='non-promo'&&b.fixedOdds&&b.bsp){
      ev+=(b.fixedOdds/b.bsp-1)*(b.stake||0);
    } else {
      const pr=promos.find(p=>p.id===b.promoId);
      if(pr?.ev) ev+=pr.ev/100*(b.stake||0);
    }
  });

  // Extraction rate
  const bonusFace=bonuses.reduce((a,b)=>a+(parseFloat(b.bonusAmount)||0),0);
  const extraction=bonusFace>0?(bonusPnl/bonusFace*100):null;

  // Non-promo ratio
  const promoCount=settled.filter(b=>b.betCategory!=='non-promo').length;
  const npCount=settled.filter(b=>b.betCategory==='non-promo').length;

  // Turnover
  const turnover=settled.reduce((a,b)=>a+(b.stake||0),0);

  return {
    userId:row.user_id, email, displayName, updatedAt:row.updated_at,
    data:d, settings, bets, bonuses, bookies, promos, checkpoint,
    stats:{totalPnl,bonusPnl,cashPnl,ev,extraction,promoCount,npCount,turnover,betsCount:settled.length,bonusFace,resolvedBonuses:resolvedBonuses.length}
  };
}

// ── RENDER GRID ───────────────────────────────────────────────────
function renderGrid(){
  const grid=document.getElementById('sgrid');
  if(!_students.length){grid.innerHTML='<div class="empty">No students found</div>';return;}
  grid.innerHTML=_students.map((s,i)=>{
    const st=s.stats;
    const pnlC=st.totalPnl>=0?'var(--g)':'var(--r)';
    const pnlStr=(st.totalPnl>=0?'+':'')+st.totalPnl.toFixed(0);
    const evStr=st.ev>=0?'+$'+st.ev.toFixed(0):'$'+st.ev.toFixed(0);
    const lastActive=s.updatedAt?new Date(s.updatedAt).toLocaleDateString('en-AU'):'unknown';
    const extStr=st.extraction!=null?st.extraction.toFixed(0)+'%':'—';
    return `<div class="sc" onclick="openDetail(${i})">
      <div class="sc-name">${s.displayName}</div>
      <div class="sc-sub">Last active: ${lastActive} · ${st.betsCount} bets</div>
      <div class="sc-stats">
        <div class="ss"><div class="ss-lbl">P&L</div><div class="ss-val" style="color:${pnlC}">$${pnlStr}</div></div>
        <div class="ss"><div class="ss-lbl">EV</div><div class="ss-val bl">${evStr}</div></div>
        <div class="ss"><div class="ss-lbl">Extraction</div><div class="ss-val" style="color:${st.extraction!=null&&st.extraction>=75?'var(--g)':'var(--am)'}">${extStr}</div></div>
      </div>
      <div class="sc-foot">
        <span class="cp-badge">CP ${s.checkpoint}</span>
        <span style="font-size:10px;color:var(--tx5)">NP ratio: ${st.promoCount?Math.round(st.npCount/st.promoCount*100)+'%':'—'}</span>
      </div>
    </div>`;
  }).join('');
}

// ── DETAIL ────────────────────────────────────────────────────────
function openDetail(idx){
  _detail=_students[idx];
  const s=_detail, st=s.stats;
  document.getElementById('d-name').textContent=s.displayName;
  document.getElementById('d-email').textContent=s.email?'Email: '+s.email:'User ID: '+s.userId;
  document.getElementById('d-cp').textContent='CP '+s.checkpoint;

  const pnlC=st.totalPnl>=0?'var(--g)':'var(--r)';
  const activeBk=s.bookies.filter(b=>b.active).length;
  document.getElementById('d-stats').innerHTML=[
    {lbl:'Total P&L',val:'$'+(st.totalPnl>=0?'+':'')+st.totalPnl.toFixed(2),c:pnlC},
    {lbl:'Cash P&L',val:'$'+(st.cashPnl>=0?'+':'')+st.cashPnl.toFixed(2),c:st.cashPnl>=0?'var(--g)':'var(--r)'},
    {lbl:'Bonus P&L',val:'$'+(st.bonusPnl>=0?'+':'')+st.bonusPnl.toFixed(2),c:st.bonusPnl>=0?'var(--g)':'var(--r)'},
    {lbl:'Total EV',val:'$'+st.ev.toFixed(2),c:'var(--bl)'},
    {lbl:'Extraction',val:st.extraction!=null?st.extraction.toFixed(1)+'%':'—',c:st.extraction>=75?'var(--g)':'var(--am)'},
    {lbl:'Turnover',val:'$'+st.turnover.toFixed(0),c:'var(--tx)'},
    {lbl:'Bets',val:st.betsCount,c:'var(--tx)'},
    {lbl:'Active Bookies',val:activeBk,c:'var(--tx)'},
    {lbl:'Checkpoint',val:'CP '+s.checkpoint,c:'var(--pu)'},
  ].map(x=>`<div class="ds"><div class="ds-lbl">${x.lbl}</div><div class="ds-val" style="color:${x.c}">${x.val}</div></div>`).join('');

  // Recent bets
  const bkMap=Object.fromEntries(s.bookies.map(b=>[b.id,b.name||b.alias||b.id]));
  const prMap=Object.fromEntries(s.promos.map(p=>[p.id,p.name||'Promo']));
  const recent=s.bets.filter(b=>b.result&&b.result!=='Pending').sort((a,b)=>new Date(b.date||b.createdAt||0)-new Date(a.date||a.createdAt||0)).slice(0,20);
  document.getElementById('d-bets').innerHTML=recent.length?recent.map(b=>{
    let pnl=0;
    if(b.result==='Win')pnl=(b.fixedOdds-1)*(b.stake||0);
    else if(b.result==='Loss')pnl=-(b.stake||0);
    const pnlC=pnl>0?'var(--g)':pnl<0?'var(--r)':'var(--tx5)';
    let ev=null;
    if(b.betCategory==='non-promo'&&b.fixedOdds&&b.bsp) ev=(b.fixedOdds/b.bsp-1)*(b.stake||0);
    else{const pr=s.promos.find(p=>p.id===b.promoId);if(pr?.ev)ev=pr.ev/100*(b.stake||0);}
    const evPct=b.fixedOdds&&b.bsp?((b.fixedOdds/b.bsp-1)*100).toFixed(1)+'%':'—';
    return `<tr>
      <td>${b.date||'—'}</td>
      <td>${bkMap[b.bookieId]||'?'}</td>
      <td>${b.betCategory==='non-promo'?'Non-promo':(prMap[b.promoId]||'Promo')}</td>
      <td>$${(b.stake||0).toFixed(0)}</td>
      <td>${b.fixedOdds||'—'}</td>
      <td>${b.bsp||'—'}</td>
      <td style="color:${ev!=null&&ev>0?'var(--g)':'var(--tx4)'}">${evPct}</td>
      <td>${b.result}</td>
      <td style="color:${pnlC}">${pnl!==0?'$'+(pnl>=0?'+':'')+pnl.toFixed(2):'—'}</td>
    </tr>`;
  }).join(''):'<tr><td colspan="9" style="text-align:center;color:var(--tx5)">No settled bets</td></tr>';

  document.getElementById('d-prof').textContent=s.settings?.agentProfile||s.data?.agentProfile||'No coaching profile yet.';

  const totalBon=s.bonuses.length;
  const laidBon=s.bonuses.filter(b=>b.layStake||b.layOdds).length;
  document.getElementById('d-bon').innerHTML=`Total bonuses: <b>${totalBon}</b> &nbsp;|&nbsp; Laid: <b>${laidBon}</b> &nbsp;|&nbsp; Resolved: <b>${st.resolvedBonuses}</b> &nbsp;|&nbsp; Face value: <b>$${st.bonusFace.toFixed(0)}</b> &nbsp;|&nbsp; Bonus P&L: <b style="color:${st.bonusPnl>=0?'var(--g)':'var(--r)'}">$${st.bonusPnl.toFixed(2)}</b>`;

  document.getElementById('dmodal').classList.add('open');
}
function closeDetail(){document.getElementById('dmodal').classList.remove('open');_detail=null;}

// ── CHECKPOINT ADJUST ─────────────────────────────────────────────
async function adjCP(delta){
  if(!_detail)return;
  const s=_detail;
  const newCp=Math.max(1,(s.checkpoint||1)+delta);
  if(newCp===s.checkpoint)return;
  const newData={...(s.data||{})};
  newData.settings={...(newData.settings||{}),checkpoint:newCp};
  const {error}=await supa.from('user_data').update({data:newData,updated_at:new Date().toISOString()}).eq('user_id',s.userId);
  if(error){toast('Error: '+error.message,'err');return;}
  s.checkpoint=newCp; s.settings.checkpoint=newCp; s.data.settings=newData.settings;
  document.getElementById('d-cp').textContent='CP '+newCp;
  toast((delta>0?'Moved to':'Moved back to')+' CP '+newCp,'ok');
  renderGrid();
}

// ── REALTIME ──────────────────────────────────────────────────────
function setupRealtime(){
  try{supa.realtime.disconnect();}catch(e){}
  _ch=supa.channel('coach-rt')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'user_data'},payload=>{
      const row=payload.new; if(!row)return;
      const existing=_students.find(s=>s.userId===row.user_id);
      const oldCp=existing?.checkpoint||1;
      const updated=buildStudent(row);
      if(existing){
        const i=_students.indexOf(existing);
        _students[i]=updated;updated.email=updated.email||existing.email;
      } else {_students.unshift(updated);}
      if(updated.checkpoint>oldCp){
        const n={name:updated.displayName,from:oldCp,to:updated.checkpoint,time:new Date().toLocaleString('en-AU')};
        _notifs.unshift(n);
        document.getElementById('ndot').style.display='inline-block';
        toast('🎓 '+n.name+' advanced to CP '+n.to,'ok');
        renderNotifs();
      }
      renderGrid();
    }).subscribe();
}
function renderNotifs(){
  const el=document.getElementById('nlist');
  if(!_notifs.length){el.innerHTML='<div class="empty">No notifications yet</div>';return;}
  el.innerHTML=_notifs.slice(0,20).map(n=>`<div class="nitem"><div>🎓 <b>${n.name}</b> advanced CP ${n.from} → CP ${n.to}</div><div class="ntime">${n.time}</div></div>`).join('');
}
function toggleNotifs(){
  const p=document.getElementById('npanel');
  p.style.display=p.style.display==='none'?'block':'none';
  document.getElementById('ndot').style.display='none';
}

// ── TOAST ─────────────────────────────────────────────────────────
let _tt;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+(type==='err'?'terr':'tok');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),3500);
}

document.getElementById('dmodal').addEventListener('click',function(e){if(e.target===this)closeDetail();});
</script>
</body>
